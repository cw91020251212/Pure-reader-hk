        function restartTTSWithNewSettings() {
            if(isPlaying) { let tempIndex = currentIndex; stopExportTts(); prepareTTS(); startReadingFrom(tempIndex); } 
            else { prepareTTS(); }
            if (typeof injectSmartButtons === 'function') injectSmartButtons();
        }

        function prepareTTS() {
            utterances = [];
            let allElements = Array.from(document.getElementById('content-wrapper').querySelectorAll('h1, h2, h3, h4, h5, h6, p, li'));
            let elements = allElements.filter(el => !el.querySelector('h1, h2, h3, h4, h5, h6, p, li'));

            let voices = window.speechSynthesis.getVoices();
            let voice = selectedVoiceName ? voices.find(v => v.name === selectedVoiceName) : null;
            if (!voice) voice = voices.find(v => {
                const lang = v.lang.toLowerCase(), name = v.name.toLowerCase();
                return lang.includes('hk') || lang.includes('yue') || name.includes('cantonese');
            }) || voices.find(v => v.lang.includes('zh'));

            elements.forEach((el) => {
                let text = el.innerText.trim();
                if (text) {
                    el.classList.add('readable-item');
                    
                    let newEl = el.cloneNode(true);
                    el.parentNode.replaceChild(newEl, el);

                    let u = new SpeechSynthesisUtterance(text);
                    if (voice) {
                        u.voice = voice;
                        u.lang = voice.lang; 
                    }
                    u.rate = currentRate;
                    
                    let uIndex = utterances.length;
                    u.onstart = () => {
                        document.querySelectorAll('.reading-highlight, .paused-highlight').forEach(e => {
                            e.classList.remove('reading-highlight', 'paused-highlight');
                        });
                        newEl.classList.add('reading-highlight');
                        if(isPlaying) newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        SafeStorage.set('ttsBookmark_' + document.title, uIndex);
                        currentIndex = uIndex; 
                    };
                    u.onend = () => {
                        newEl.classList.remove('reading-highlight', 'paused-highlight');

                        if (isPlaying && !isPaused && !isManualJump) {
                            if (currentIndex + 1 < utterances.length) playUtterance(currentIndex + 1); else stopExportTts();
                        }
                    };
                    
                    utterances.push({ u: u, el: newEl });
                    
                    newEl.addEventListener('click', (e) => {
                        if(e.target.tagName === 'A' && document.body.dataset.clickRead !== 'off') {
                            e.preventDefault();
                        }
                        if(e.target.closest('.util-copy-btn')) return;
                        
                        let isDeleteModeActive = document.querySelector('.delete-mode-active') !== null;
                        if (document.body.dataset.clickRead === 'off' || isDeleteModeActive) return; 
                        
                        e.preventDefault(); e.stopPropagation(); 
                        
                        if (uIndex === currentIndex && isPlaying) {
                            stopExportTts();
                            return;
                        }

                        startReadingFrom(uIndex);
                    });
                }
            });
        }

        function playUtterance(index) { if (index >= utterances.length) return; currentIndex = index; window.speechSynthesis.speak(utterances[index].u); }
        
        function startReadingFrom(index) {
            isManualJump = true;
            window.speechSynthesis.cancel();
            setTimeout(() => {
                isManualJump = false; isPlaying = true; isPaused = false;
                playUtterance(index);

        <button id="scrollToTopBtn" onclick="scrollToTop()" class="scroll-btn hidden" title="回到頂部">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        
        <button id="fabExecuteDeleteBtn" onclick="executeDelete()" class="trash-btn hidden" title="刪除所選">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        
        <div class="control-panel collapsed" id="readerControls">
            <div class="panel-row">
                <span class="panel-label">朗讀功能</span>
                <button id="clickModeBtn" class="action-btn wide bg-red-100 text-red-700 hover:bg-red-200 border border-red-700/50" onclick="toggleClickToRead()">🔴 朗讀：關閉</button>
            </div>
            <div class="panel-row">
                <span class="panel-label">文字大小</span>
                <div class="btn-group">
                    <button class="action-btn" onclick="adjustSize(-2)" title="縮細文字">A-</button>
                    <button class="action-btn" onclick="adjustSize(2)" title="放大文字">A+</button>
                </div>
            </div>
            <div class="panel-row">
                <span class="panel-label">聲音選擇</span>
                <select id="voiceSelect" class="custom-select" onchange="changeVoice()"><option value="">載入中...</option></select>
            </div>
            <div class="panel-row">
                <span class="panel-label">語速調整</span>
                <select id="rateSelect" class="custom-select" onchange="changeRate()">
                    <option value="0.75">慢速 0.75x</option>
                    <option value="1.0" selected>正常 1.00x</option>
                    <option value="1.25">稍快 1.25x</option>
                    <option value="1.5">極快 1.50x</option>
                </select>
            </div>
        </div>
    </div>
    
    <div id="content-wrapper">
        ${finalContent}
    </div>

    <script>
        const SafeStorage = {
            get: function(key) { try { return window.localStorage.getItem(key); } catch(e) { return null; } },
            set: function(key, val) { try { window.localStorage.setItem(key, val); } catch(e) { console.warn("Local storage disabled."); } }
        };

        // 匯出檔案的核心修正：套用 event 阻截
        function toggleReaderControls(event) {
            if (event) {
                event.stopPropagation();
            }
            const controls = document.getElementById('readerControls');
            if (controls) {
                controls.classList.toggle('collapsed');
            }
        }

        document.addEventListener('click', function(event) {
            const controls = document.getElementById('readerControls');
            if (controls && !controls.classList.contains('collapsed')) {
                if (!controls.contains(event.target)) {
                    controls.classList.add('collapsed');
                }
            }
        });

        function toggleClickToRead() {
            const btn = document.getElementById('clickModeBtn');
            const isOn = document.body.dataset.clickRead !== 'off';
            
            if(isOn) {
                document.body.dataset.clickRead = 'off';
                btn.innerHTML = '🔴 朗讀：關閉';
                btn.className = 'action-btn wide bg-red-100 text-red-700 hover:bg-red-200 border border-red-700/50';
                
                window.speechSynthesis.cancel();
                isPlaying = false; 
                isPaused = false;
                document.querySelectorAll('.reading-highlight, .paused-highlight').forEach(e => {
                    e.classList.remove('reading-highlight', 'paused-highlight');
                });
            } else {
                document.body.dataset.clickRead = 'on';
                btn.innerHTML = '🟢 朗讀：開啟';
                btn.className = 'action-btn wide bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border border-emerald-700/50';
            }
        }

        let currentSize = parseInt(SafeStorage.get('fontSize_' + document.title)) || 18;
        document.documentElement.style.setProperty('--base-font-size', currentSize + 'px');
        
        function adjustSize(delta) {
            currentSize += delta;
            if (currentSize < 12) currentSize = 12;
            if (currentSize > 48) currentSize = 48;
            document.documentElement.style.setProperty('--base-font-size', currentSize + 'px');
            SafeStorage.set('fontSize_' + document.title, currentSize);
        }

        let isPlaying = false, isPaused = false, isManualJump = false;
        let utterances = [], currentIndex = parseInt(SafeStorage.get('ttsBookmark_' + document.title)) || 0;
        
        let selectedVoiceName = SafeStorage.get('ttsVoiceName_v18') || '';
        let currentRate = parseFloat(SafeStorage.get('ttsRate_' + document.title)) || 1.0;

        function populateVoices() {
            let voices = window.speechSynthesis.getVoices();
            let voiceSelect = document.getElementById('voiceSelect');
            if(!voiceSelect) return;
            voiceSelect.innerHTML = '';

            let zhVoices = voices.filter(v => {
                const lang = v.lang.toLowerCase(), name = v.name.toLowerCase();
                return lang.includes('hk') || lang.includes('yue') || lang.includes('tw') || lang.includes('zh') || name.includes('cantonese') || name.includes('chinese');
            });
            
            // 核心修改：放寬過濾條件，改用更精確的 ID (voiceURI) 區分，防止同名的不同音色被隱藏
            let uniqueVoices = [], seenIDs = new Set();
            zhVoices.forEach(v => {
                let id = (v.voiceURI || 'default_uri') + '_' + v.name; 
                if(!seenIDs.has(id)) { 
                    seenIDs.add(id); 
                    uniqueVoices.push(v); 
                }
            });

            uniqueVoices.sort((a, b) => {
                let aIsYue = a.lang.toLowerCase().includes('hk') || a.lang.toLowerCase().includes('yue') || a.name.toLowerCase().includes('cantonese') ? 1 : 0;
                let bIsYue = b.lang.toLowerCase().includes('hk') || b.lang.toLowerCase().includes('yue') || b.name.toLowerCase().includes('cantonese') ? 1 : 0;
                return bIsYue - aIsYue;
            });

            if (uniqueVoices.length === 0) {
                let opt = document.createElement('option');
                opt.value = ''; opt.textContent = '系統預設語音';
                voiceSelect.appendChild(opt); return;
            }

            uniqueVoices.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.name; 
                let label = v.name;
                let nameLow = label.toLowerCase();
                
                if (nameLow.includes('danny') || nameLow.includes('zhiwei') || label.includes('男') || nameLow.includes('male') || nameLow.includes('aaron')) label += ' (男聲)';
                if (nameLow.includes('sin-ji') || nameLow.includes('meijia') || nameLow.includes('ting-ting') || nameLow.includes('tracy') || label.includes('女') || nameLow.includes('female')) label += ' (女聲)';
                
                if (v.lang.toLowerCase().includes('hk') || v.lang.toLowerCase().includes('yue')) label = '🇭🇰 ' + label;
                else if (v.lang.toLowerCase().includes('tw')) label = '🇹🇼 ' + label;
                else label = '🇨🇳 ' + label;
                
                opt.textContent = label;
                voiceSelect.appendChild(opt);
            });
            
            if(selectedVoiceName && uniqueVoices.find(v => v.name === selectedVoiceName)) {
                voiceSelect.value = selectedVoiceName;
            } else {
                selectedVoiceName = voiceSelect.value;
            }
        }

        function changeVoice() { 
            selectedVoiceName = document.getElementById('voiceSelect').value; 
            SafeStorage.set('ttsVoiceName_v18', selectedVoiceName);
            restartTTSWithNewSettings(); 
        }
        function changeRate() { 
            currentRate = parseFloat(document.getElementById('rateSelect').value); 
            SafeStorage.set('ttsRate_' + document.title, currentRate);
            restartTTSWithNewSettings(); 
        }
        function restartTTSWithNewSettings() {
            if(isPlaying) { let tempIndex = currentIndex; stopExportTts(); prepareTTS(); startReadingFrom(tempIndex); } 
            else { prepareTTS(); }
        }

        function prepareTTS() {
            utterances = [];
            let allElements = Array.from(document.getElementById('content-wrapper').querySelectorAll('h1, h2, h3, h4, h5, h6, p, li'));
            let elements = allElements.filter(el => !el.querySelector('h1, h2, h3, h4, h5, h6, p, li'));

            let voices = window.speechSynthesis.getVoices();
            let voice = selectedVoiceName ? voices.find(v => v.name === selectedVoiceName) : null;
            if (!voice) voice = voices.find(v => {
                const lang = v.lang.toLowerCase(), name = v.name.toLowerCase();
                return lang.includes('hk') || lang.includes('yue') || name.includes('cantonese');
            }) || voices.find(v => v.lang.includes('zh'));

            elements.forEach((el) => {
                let text = el.innerText.trim();
                if (text) {
                    el.classList.add('readable-item');
                    
                    let newEl = el.cloneNode(true);
                    el.parentNode.replaceChild(newEl, el);

                    let u = new SpeechSynthesisUtterance(text);
                    if (voice) {
                        u.voice = voice;
                        u.lang = voice.lang; 
                    }
                    u.rate = currentRate;
                    
                    let uIndex = utterances.length;
                    u.onstart = () => {
                        document.querySelectorAll('.reading-highlight, .paused-highlight').forEach(e => {
                            e.classList.remove('reading-highlight', 'paused-highlight');
                        });
                        newEl.classList.add('reading-highlight');
                        if(isPlaying) newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        SafeStorage.set('ttsBookmark_' + document.title, uIndex);
                        currentIndex = uIndex; 
                    };
                    u.onend = () => {
                        newEl.classList.remove('reading-highlight', 'paused-highlight');

                        if (isPlaying && !isPaused && !isManualJump) {
                            if (currentIndex + 1 < utterances.length) playUtterance(currentIndex + 1); else stopExportTts();
                        }
                    };
                    
                    utterances.push({ u: u, el: newEl });
                    
                    newEl.addEventListener('click', (e) => {
                        if(e.target.tagName === 'A' && document.body.dataset.clickRead !== 'off') {
                            e.preventDefault();
                        }
                        if(e.target.closest('.util-copy-btn')) return;
                        
                        let isDeleteModeActive = document.querySelector('.delete-mode-active') !== null;
                        if (document.body.dataset.clickRead === 'off' || isDeleteModeActive) return; 
                        
                        e.preventDefault(); e.stopPropagation(); 
                        
                        if (uIndex === currentIndex && isPlaying) {
                            stopExportTts();
                            return;
                        }

                        startReadingFrom(uIndex);
                    });
                }
            });
        }

        function playUtterance(index) { if (index >= utterances.length) return; currentIndex = index; window.speechSynthesis.speak(utterances[index].u); }
        
        function startReadingFrom(index) {
            isManualJump = true;
            window.speechSynthesis.cancel();
            setTimeout(() => {
                isManualJump = false; isPlaying = true; isPaused = false;
                playUtterance(index);
            }, 50);
        }

        function stopExportTts() {
            isManualJump = true; window.speechSynthesis.cancel(); isPlaying = false; isPaused = false;
            document.querySelectorAll('.reading-highlight, .paused-highlight').forEach(e => {
                e.classList.remove('reading-highlight', 'paused-highlight');
            });
            setTimeout(() => { isManualJump = false; }, 50);
        }
        
        window.speechSynthesis.onvoiceschanged = () => { populateVoices(); if(utterances.length === 0) { prepareTTS(); if (typeof injectSmartButtons === 'function') injectSmartButtons(); } };

        window.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
            populateVoices();
            prepareTTS();
            if (currentIndex > 0 && utterances[currentIndex]) {
                utterances[currentIndex].el.classList.add('reading-highlight');
            }
            checkScrollButtons();

        });
        
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
        
        function checkScrollButtons() {
            const topBtn = document.getElementById('scrollToTopBtn');
            const bottomBtn = document.getElementById('scrollToBottomBtn');
            if (!topBtn || !bottomBtn) return;
            
            if (window.scrollY > 300) topBtn.classList.remove('hidden');
            else topBtn.classList.add('hidden');
            
            const isAtBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
            const isLongPage = document.body.offsetHeight > window.innerHeight * 1.5;
            
            if (isLongPage && !isAtBottom) bottomBtn.classList.remove('hidden');
            else bottomBtn.classList.add('hidden');
        }
        window.addEventListener('scroll', checkScrollButtons);
        
    <${"/"}script>
</body>
</html>`;

            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: `${articleTitle || '純淨文章'}.html`,
                        types: [{ description: 'HTML 網頁檔', accept: { 'text/html': ['.html'] } }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(downloadContent);
                    await writable.close();
                    return;
                }
            } catch (error) {
                if (error.name !== 'AbortError') console.error('儲存檔案時發生錯誤:', error);
                return;
            }

            const customName = prompt("請輸入檔案名稱：", articleTitle || '純淨文章');
            if (customName === null) return;
            let finalName = customName.trim();
            if (!finalName.endsWith('.html')) finalName += '.html';
            const blob = new Blob([downloadContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = finalName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
